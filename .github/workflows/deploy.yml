name: Deploy to GitHub Pages

# Builds the site on every push to main (including CMS edits) and publishes
# the result to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # For a custom domain, set repo variables BASE_PATH=/ and SITE_URL=https://www.your-domain
          SITE_URL: ${{ vars.SITE_URL || 'https://mjaffry01.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/mindsuiteCMS' }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
